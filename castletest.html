<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>maptest</title>
</head>
<body>
<script src="js/config.js"></script>
<script src="js/refmaps.js"></script>
<script src="js/terrain.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  Terrain.preload().then(function () {
    try {
      var fails = 0;
      var failInfo = [];
      for (var tk in REFMAPS) {
        Terrain.build(tk);
        var bad = [];
        var nSolid = 0;
        var minTop = Infinity, maxTop = 0;
        for (var x = 0; x < 1280; x++) {
          var s = Terrain.surfaceY(x);
          if (s >= 0 && s < CFG.WATER_Y) nSolid++;
          if (s >= 0 && s < minTop) minTop = s;
          if (s > maxTop && s < CFG.WATER_Y) maxTop = s;
        }
        if (nSolid < 1100) bad.push('solid=' + nSolid);
        if (minTop > 300) bad.push('minTop=' + minTop);
        if (maxTop >= CFG.WATER_Y) bad.push('maxTop=' + maxTop);
        var spawns = 0;
        for (var i = 0; i < Terrain.spawnXs.length; i++) {
          var sy = Terrain.surfaceY(Terrain.spawnXs[i]);
          if (sy >= 30 && sy < CFG.WATER_Y - 40) spawns++;
        }
        if (spawns < 4) bad.push('spawns=' + spawns);
        var surf = Terrain.surfaceY(640);
        if (surf <= 0 || surf >= CFG.WATER_Y) bad.push('center=' + surf);
        if (bad.length) {
          fails++;
          failInfo.push(tk + ':' + bad.join(','));
        }
      }
      document.title = 'MAPTEST ' + (fails ? 'FAIL: ' + failInfo.join(' | ') : 'ALL OK');
    } catch (e) {
      document.title = 'MAPTEST EXC: ' + e.message;
    }
  }, function () {
    document.title = 'MAPTEST PRELOAD FAIL';
  });
});
</script>
</body>
</html>
